[project]
name = "openavisio-aiservice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.0.0",
    "Pillow>=13.0.0",
    "pytesseract>=0.3.10",
    "ollama>=0.4.0",
    "openai>=1.12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.26.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pinned: ruff's default rule set changes between versions
select = ["E4", "E7", "E9", "F"]
